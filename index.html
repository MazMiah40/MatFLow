<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatCraft — Grappling Curriculum & Session Planner</title>
  
  <!-- Modern Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#035483',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDocs, 
      setDoc, 
      deleteDoc, 
      onSnapshot,
      query,
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Standard public Demo Config - replace with your Firebase Console credentials if desired
    const firebaseConfig = {
      apiKey: "AIzaSyDemoConfigForGrapplingPlannerKey",
      authDomain: "bjj-planner-demo.firebaseapp.com",
      projectId: "bjj-planner-demo",
      storageBucket: "bjj-planner-demo.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(app);
    window.firebaseDb = getFirestore(app);
    window.firebaseSDK = {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      signInAnonymously,
      collection,
      doc,
      getDocs,
      setDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="h-full text-slate-900 bg-slate-50 antialiased selection:bg-slate-200">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons
    const Icons = {
      Book: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
      Plus: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>,
      Edit: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>,
      Timer: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      Alert: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>,
      LogOut: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
      Trash: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
      Check: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>,
      Play: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>,
      Pause: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6"></path></svg>,
      Refresh: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>,
      ExternalLink: () => <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
    };

    // Main App Component
    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('library');
      const [plans, setPlans] = useState([]);
      const [selectedPlanId, setSelectedPlanId] = useState(null);
      const [selectedWeek, setSelectedWeek] = useState(1);
      const [failures, setFailures] = useState([]);

      // Auth Listener
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.firebaseAuth) {
            clearInterval(interval);
            window.firebaseSDK.onAuthStateChanged(window.firebaseAuth, (u) => {
              setUser(u);
              setLoading(false);
              if (u) {
                loadUserData(u.uid);
              } else {
                setPlans([]);
                setFailures([]);
                setSelectedPlanId(null);
              }
            });
          }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      const loadUserData = async (uid) => {
        try {
          // Fallback local storage for isolated users in client demo
          const localPlans = localStorage.getItem(`matcraft_plans_${uid}`);
          const localFailures = localStorage.getItem(`matcraft_failures_${uid}`);
          
          if (localPlans) {
            const parsed = JSON.parse(localPlans);
            setPlans(parsed);
            if (parsed.length > 0 && !selectedPlanId) {
              setSelectedPlanId(parsed[0].id);
            }
          } else {
            // Seed 1 default sample curriculum
            const sample = createSamplePlan();
            setPlans([sample]);
            setSelectedPlanId(sample.id);
            localStorage.setItem(`matcraft_plans_${uid}`, JSON.stringify([sample]));
          }

          if (localFailures) {
            setFailures(JSON.parse(localFailures));
          }
        } catch (err) {
          console.error("Error loading user data:", err);
        }
      };

      const savePlans = (newPlans) => {
        setPlans(newPlans);
        if (user) {
          localStorage.setItem(`matcraft_plans_${user.uid}`, JSON.stringify(newPlans));
        }
      };

      const saveFailures = (newFailures) => {
        setFailures(newFailures);
        if (user) {
          localStorage.setItem(`matcraft_failures_${user.uid}`, JSON.stringify(newFailures));
        }
      };

      const handleLogout = () => {
        window.firebaseSDK.signOut(window.firebaseAuth);
      };

      if (loading) {
        return (
          <div class="h-full w-full flex items-center justify-center bg-slate-50">
            <div class="text-center">
              <div class="w-8 h-8 border-2 border-slate-900 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
              <p class="text-xs font-mono uppercase tracking-wider text-slate-500">Initializing Session...</p>
            </div>
          </div>
        );
      }

      // STRICT AUTH GATE: Show Authentication Portal when logged out
      if (!user) {
        return <AuthPortal onAuthSuccess={(u) => setUser(u)} />;
      }

      const selectedPlan = plans.find(p => p.id === selectedPlanId) || plans[0];

      return (
        <div class="min-h-full flex flex-col bg-slate-50">
          <!-- Top Technical Header -->
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex justify-between h-16 items-center">
                
                <!-- Brand -->
                <div class="flex items-center space-x-3">
                  <div class="w-8 h-8 bg-slate-900 text-white flex items-center justify-center font-extrabold tracking-tighter text-sm rounded">
                    MC
                  </div>
                  <div>
                    <h1 class="text-sm font-bold tracking-tight text-slate-900 uppercase">MATCRAFT</h1>
                    <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Curriculum & Session System</p>
                  </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="hidden md:flex space-x-1">
                  <TabButton id="library" label="Curriculum Library" icon={<Icons.Book />} activeTab={activeTab} setActiveTab={setActiveTab} badge={plans.length} />
                  <TabButton id="wizard" label="New Curriculum Wizard" icon={<Icons.Plus />} activeTab={activeTab} setActiveTab={setActiveTab} />
                  {selectedPlan && (
                    <>
                      <TabButton id="editor" label={`Edit: ${selectedPlan.title.substring(0, 18)}...`} icon={<Icons.Edit />} activeTab={activeTab} setActiveTab={setActiveTab} />
                      <TabButton id="timer" label="Mat-Side Timer" icon={<Icons.Timer />} activeTab={activeTab} setActiveTab={setActiveTab} />
                    </>
                  )}
                  <TabButton id="failures" label="Failure Log" icon={<Icons.Alert />} activeTab={activeTab} setActiveTab={setActiveTab} badge={failures.length} />
                </nav>

                <!-- User / Logout -->
                <div class="flex items-center space-x-3">
                  <span class="text-xs font-mono text-slate-600 bg-slate-100 px-2.5 py-1 rounded border border-slate-200 hidden sm:inline-block">
                    {user.email || 'Coach Guest'}
                  </span>
                  <button 
                    onClick={handleLogout}
                    class="p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded transition-colors"
                    title="Sign Out Coach Account"
                  >
                    <Icons.LogOut />
                  </button>
                </div>
              </div>

              <!-- Mobile Nav Subbar -->
              <div class="flex md:hidden border-t border-slate-100 py-2 overflow-x-auto space-x-1">
                <TabButton id="library" label="Library" activeTab={activeTab} setActiveTab={setActiveTab} />
                <TabButton id="wizard" label="+ New Plan" activeTab={activeTab} setActiveTab={setActiveTab} />
                {selectedPlan && <TabButton id="editor" label="Edit Plan" activeTab={activeTab} setActiveTab={setActiveTab} />}
                {selectedPlan && <TabButton id="timer" label="Timer" activeTab={activeTab} setActiveTab={setActiveTab} />}
                <TabButton id="failures" label="Failures" activeTab={activeTab} setActiveTab={setActiveTab} />
              </div>
            </div>
          </header>

          <!-- Main Content View -->
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'library' && (
              <CurriculumLibrary 
                plans={plans} 
                onSelectPlan={(id) => { setSelectedPlanId(id); setActiveTab('editor'); }}
                onStartTimer={(id) => { setSelectedPlanId(id); setActiveTab('timer'); }}
                onDeletePlan={(id) => savePlans(plans.filter(p => p.id !== id))}
                onCreateBlank={() => setActiveTab('wizard')}
              />
            )}

            {activeTab === 'wizard' && (
              <PlanWizard onPlanCreated={(newPlan) => {
                const updated = [newPlan, ...plans];
                savePlans(updated);
                setSelectedPlanId(newPlan.id);
                setActiveTab('editor');
              }} />
            )}

            {activeTab === 'editor' && selectedPlan && (
              <PlanEditor 
                plan={selectedPlan} 
                selectedWeek={selectedWeek}
                setSelectedWeek={setSelectedWeek}
                onUpdatePlan={(updatedPlan) => {
                  savePlans(plans.map(p => p.id === updatedPlan.id ? updatedPlan : p));
                }}
              />
            )}

            {activeTab === 'timer' && selectedPlan && (
              <MatTimer 
                plan={selectedPlan} 
                selectedWeek={selectedWeek}
                setSelectedWeek={setSelectedWeek}
                failures={failures}
                onLogFailure={(fail) => saveFailures([fail, ...failures])}
              />
            )}

            {activeTab === 'failures' && (
              <FailureLogger 
                failures={failures} 
                onDeleteFailure={(id) => saveFailures(failures.filter(f => f.id !== id))}
              />
            )}
          </main>
        </div>
      );
    }

    // Nav Button Component
    function TabButton({ id, label, icon, activeTab, setActiveTab, badge }) {
      const active = activeTab === id;
      return (
        <button
          onClick={() => setActiveTab(id)}
          class={`flex items-center space-x-2 px-3 py-1.5 text-xs font-medium rounded transition-all ${
            active 
              ? 'bg-slate-900 text-white shadow-sm' 
              : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
          }`}
        >
          {icon && <span>{icon}</span>}
          <span>{label}</span>
          {badge !== undefined && (
            <span class={`ml-1 px-1.5 py-0.2 rounded text-[10px] font-mono ${
              active ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-700'
            }`}>
              {badge}
            </span>
          )}
        </button>
      );
    }

    // STRICT AUTH PORTAL
    function AuthPortal({ onAuthSuccess }) {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setSubmitting(true);
        try {
          if (isSignUp) {
            const res = await window.firebaseSDK.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
            onAuthSuccess(res.user);
          } else {
            const res = await window.firebaseSDK.signInWithEmailAndPassword(window.firebaseAuth, email, password);
            onAuthSuccess(res.user);
          }
        } catch (err) {
          setError(err.message.replace('Firebase: ', ''));
        } finally {
          setSubmitting(false);
        }
      };

      const handleGuestLogin = async () => {
        setSubmitting(true);
        try {
          const res = await window.firebaseSDK.signInAnonymously(window.firebaseAuth);
          onAuthSuccess(res.user);
        } catch (err) {
          setError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-50">
          <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
            <div class="w-12 h-12 bg-slate-900 text-white flex items-center justify-center font-black text-lg mx-auto rounded shadow-sm">
              MC
            </div>
            <h2 class="mt-4 text-xl font-bold tracking-tight text-slate-900 uppercase">MATCRAFT PRO</h2>
            <p class="mt-1 text-xs text-slate-500 font-mono">Structured Grappling & Private Session Manager</p>
          </div>

          <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-lg sm:px-10">
              <div class="mb-6 border-b border-slate-100 pb-4">
                <h3 class="text-sm font-semibold text-slate-900">
                  {isSignUp ? 'Create Coach Account' : 'Coach Portal Authentication'}
                </h3>
                <p class="text-xs text-slate-500 mt-0.5">
                  Sign in to access your gym's isolated curriculum plans.
                </p>
              </div>

              {error && (
                <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded">
                  {error}
                </div>
              )}

              <form class="space-y-4" onSubmit={handleSubmit}>
                <div>
                  <label class="block text-xs font-mono uppercase text-slate-700 mb-1">Email Address</label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="coach@gym.com"
                    class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900"
                  />
                </div>

                <div>
                  <label class="block text-xs font-mono uppercase text-slate-700 mb-1">Password</label>
                  <input
                    type="password"

    function MatTimer({ plan, selectedWeek, setSelectedWeek, failures, onLogFailure }) {
      const currentWeekData = plan.weeks?.find(w => w.week === selectedWeek) || plan.weeks[0];
      
      const [secondsLeft, setSecondsLeft] = useState(600); // 10 min default
      const [isRunning, setIsRunning] = useState(false);
      const [currentPhase, setCurrentPhase] = useState('Warmup');
      const [newFailNote, setNewFailNote] = useState('');

      useEffect(() => {
        let interval = null;
        if (isRunning && secondsLeft > 0) {
          interval = setInterval(() => setSecondsLeft(s => s - 1), 1000);
        } else if (secondsLeft === 0) {
          setIsRunning(false);
        }
        return () => clearInterval(interval);
      }, [isRunning, secondsLeft]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const setTimerPhase = (name, mins) => {
        setCurrentPhase(name);
        setSecondsLeft(mins * 60);
        setIsRunning(false);
      };

      const handleAddFailure = (e) => {
        e.preventDefault();
        if (!newFailNote) return;
        
        onLogFailure({
          id: 'fail_' + Date.now(),
          week: selectedWeek,
          note: newFailNote,
          date: new Date().toISOString().split('T')[0]
        });
        setNewFailNote('');
      };

      return (
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          
          <!-- Timer Column -->
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white border border-slate-200 rounded-lg p-6 text-center shadow-sm">
              <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-mono uppercase tracking-wider text-slate-500">
                  {plan.title} · WEEK {selectedWeek}
                </span>
                <span class="text-xs font-mono uppercase tracking-wider bg-slate-900 text-white px-2 py-0.5 rounded">
                  {currentPhase} PHASE
                </span>
              </div>

              <!-- Digital Clock Display -->
              <div class="text-6xl sm:text-7xl font-mono font-bold text-slate-900 tracking-tight my-6">
                {formatTime(secondsLeft)}
              </div>

              <!-- Controls -->
              <div class="flex items-center justify-center space-x-3 mb-6">
                <button
                  onClick={() => setIsRunning(!isRunning)}
                  class={`px-6 py-2.5 rounded font-medium text-xs uppercase tracking-wider flex items-center space-x-2 transition-colors ${
                    isRunning ? 'bg-amber-600 text-white hover:bg-amber-700' : 'bg-slate-900 text-white hover:bg-slate-800'
                  }`}
                >
                  {isRunning ? <Icons.Pause /> : <Icons.Play />}
                  <span>{isRunning ? 'Pause' : 'Start Timer'}</span>
                </button>

                <button
                  onClick={() => setSecondsLeft(600)}
                  class="p-2.5 border border-slate-300 text-slate-700 rounded hover:bg-slate-50"
                  title="Reset Phase"
                >
                  <Icons.Refresh />
                </button>
              </div>

              <!-- Phase Selector Buttons -->
              <div class="grid grid-cols-3 gap-2 border-t border-slate-100 pt-4">
                <button 
                  onClick={() => setTimerPhase('Warmup', 10)}
                  class="py-2 text-xs font-mono rounded bg-slate-100 hover:bg-slate-200 text-slate-800"
                >
                  Warmup (10m)
                </button>
                <button 
                  onClick={() => setTimerPhase('Technique', 25)}
                  class="py-2 text-xs font-mono rounded bg-slate-100 hover:bg-slate-200 text-slate-800"
                >
                  Technique (25m)
                </button>
                <button 
                  onClick={() => setTimerPhase('Sparring', 20)}
                  class="py-2 text-xs font-mono rounded bg-slate-100 hover:bg-slate-200 text-slate-800"
                >
                  Sparring (20m)
                </button>
              </div>
            </div>

            <!-- Current Session Plan View -->
            <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-4">
              <h3 class="text-sm font-bold text-slate-900 font-mono uppercase border-b border-slate-100 pb-2">
                ACTIVE LESSON PLAN: {currentWeekData.title}
              </h3>

              <div class="space-y-3 text-xs">
                <div>
                  <span class="font-mono text-slate-500 uppercase font-semibold">1. Warmup & Review:</span>
                  <p class="text-slate-800 mt-0.5">{currentWeekData.warmup}</p>
                </div>
                <div>
                  <span class="font-mono text-slate-500 uppercase font-semibold">2. Technique Breakdown:</span>
                  <p class="text-slate-800 mt-0.5">{currentWeekData.technique}</p>
                </div>
                <div>
                  <span class="font-mono text-slate-500 uppercase font-semibold">3. Positional Sparring Goal:</span>
                  <p class="text-slate-800 mt-0.5">{currentWeekData.sparring}</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Sparring Failures Logger Sidebar -->
          <div class="space-y-6">
            <div class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
              <h3 class="text-xs font-bold text-slate-900 font-mono uppercase mb-3 flex items-center space-x-1">
                <Icons.Alert />
                <span>SPARRING FAILURE LOGGER</span>
              </h3>
              <p class="text-xs text-slate-500 mb-4">Log immediate errors during live sparring to auto-integrate into next week's warmup.</p>

              <form onSubmit={handleAddFailure} class="space-y-3">
                <textarea
                  rows="3"
                  placeholder="e.g. Got flattened out when attempting elbow escape from mount..."
                  value={newFailNote}
                  onChange={(e) => setNewFailNote(e.target.value)}
                  class="w-full px-3 py-2 border border-slate-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-slate-900"
                />
                <button
                  type="submit"
                  class="w-full py-2 bg-slate-900 text-white text-xs font-medium uppercase tracking-wider rounded hover:bg-slate-800"
                >
                  Log Sparring Mistake
                </button>
              </form>
            </div>
          </div>

        </div>
      );
    }

    // Failure Log Component
    function FailureLogger({ failures, onDeleteFailure }) {
      return (
        <div class="space-y-6 max-w-4xl mx-auto">
          <div class="border-b border-slate-200 pb-4">
            <h2 class="text-lg font-bold text-slate-900 tracking-tight">SPARRING FAILURE REPOSITORY</h2>
            <p class="text-xs text-slate-500 font-mono">Logged tactical issues earmarked for warmup troubleshooting</p>
          </div>

          {failures.length === 0 ? (
            <div class="bg-white border border-slate-200 rounded-lg p-8 text-center">
              <p class="text-xs font-mono text-slate-500">NO FAILURE LOGS RECORDED YET</p>
            </div>
          ) : (
            <div class="space-y-3">
              {failures.map((f) => (
                <div key={f.id} class="bg-white border border-slate-200 rounded-lg p-4 flex items-center justify-between shadow-sm">
                  <div>
                    <div class="flex items-center space-x-2 mb-1">
                      <span class="text-[10px] font-mono bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200">
                        WEEK {f.week}
                      </span>
                      <span class="text-[10px] font-mono text-slate-400">{f.date}</span>
                    </div>
                    <p class="text-xs text-slate-800 font-medium">{f.note}</p>
                  </div>

                  <button
                    onClick={() => onDeleteFailure(f.id)}
                    class="text-slate-400 hover:text-red-600 p-1"
                    title="Clear Log"
                  >
                    <Icons.Trash />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Default Starter Curriculum
    function createSamplePlan() {
      return {
        id: 'plan_default_13wk',

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
