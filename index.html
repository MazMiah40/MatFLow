<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatCraft UI Rendering Preview</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="h-full text-slate-900 bg-slate-200 antialiased selection:bg-slate-300 p-4 sm:p-8 flex flex-col items-center justify-center">

  <div class="max-w-6xl w-full bg-white rounded-xl shadow-2xl border border-slate-300 overflow-hidden flex flex-col h-[85vh]">
    <!-- Mock Browser Header Bar -->
    <div class="bg-slate-100 border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-400"></div>
        <div class="w-3 h-3 rounded-full bg-amber-400"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-400"></div>
      </div>
      <div class="bg-white border border-slate-200 px-3 py-1 rounded-md text-xs font-mono text-slate-500 w-1/2 text-center shadow-inner truncate">
        https://matcraft.app/dashboard
      </div>
      <div class="text-[10px] font-mono text-slate-400 uppercase tracking-widest hidden sm:block">
        MatCraft v1.0 Preview
      </div>
    </div>

    <!-- Live React Mount Point -->
    <div id="root" class="flex-1 overflow-auto bg-slate-50"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const Icons = {
      Book: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
      Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>,
      Timer: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>,
      LogOut: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
      Play: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>,
      Pause: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 9v6m4-6v6"></path></svg>,
      Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    };

    function App() {
      const [activeTab, setActiveTab] = useState('library');
      const [plans, setPlans] = useState([createSamplePlan()]);
      const [selectedPlanId, setSelectedPlanId] = useState('plan_default_13wk');
      const [selectedWeek, setSelectedWeek] = useState(1);
      const [failures, setFailures] = useState([
        { id: 'f1', week: 1, note: 'Got flattened out when attempting elbow escape from mount', date: '2026-09-28' }
      ]);

      const selectedPlan = plans.find(p => p.id === selectedPlanId) || plans[0];

      return (
        <div className="min-h-full flex flex-col bg-slate-50">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16 items-center">
                <div className="flex items-center space-x-3">
                  <div className="w-8 h-8 bg-slate-900 text-white flex items-center justify-center font-extrabold tracking-tighter text-sm rounded">MC</div>
                  <div>
                    <h1 className="text-sm font-bold tracking-tight text-slate-900 uppercase">MATCRAFT</h1>
                    <p className="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Curriculum & Session System</p>
                  </div>
                </div>

                <nav className="flex space-x-1">
                  <TabButton id="library" label="Curriculum Library" icon={<Icons.Book />} activeTab={activeTab} setActiveTab={setActiveTab} badge={plans.length} />
                  <TabButton id="editor" label="Edit Plan" icon={<Icons.Edit />} activeTab={activeTab} setActiveTab={setActiveTab} />
                  <TabButton id="timer" label="Mat-Side Timer" icon={<Icons.Timer />} activeTab={activeTab} setActiveTab={setActiveTab} />
                  <TabButton id="failures" label="Failure Log" icon={<Icons.Alert />} activeTab={activeTab} setActiveTab={setActiveTab} badge={failures.length} />
                </nav>

                <div className="flex items-center space-x-2">
                  <span className="text-xs font-mono text-slate-600 bg-slate-100 px-2.5 py-1 rounded border border-slate-200">Coach Guest</span>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'library' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center border-b border-slate-200 pb-4">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 tracking-tight">CURRICULUM LIBRARY</h2>
                    <p className="text-xs text-slate-500 font-mono">Manage and execute structured training syllabi</p>
                  </div>
                  <button onClick={() => setActiveTab('editor')} className="inline-flex items-center space-x-2 px-4 py-2 bg-slate-900 text-white text-xs font-medium uppercase tracking-wider rounded hover:bg-slate-800">
                    <Icons.Plus /> <span>New Curriculum</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {plans.map((plan) => (
                    <div key={plan.id} className="bg-white border border-slate-200 rounded-lg p-5 flex flex-col justify-between hover:border-slate-400 transition-all shadow-sm">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <span className="text-[10px] font-mono uppercase tracking-wider bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200">{plan.style} · {plan.level}</span>
                          <span className="text-[10px] font-mono text-slate-400">{plan.weeks?.length || 0} WEEKS</span>
                        </div>
                        <h3 className="text-base font-bold text-slate-900 leading-snug mb-1">{plan.title}</h3>
                        <p className="text-xs text-slate-500 line-clamp-2 mb-4">{plan.description}</p>
                      </div>
                      <div className="border-t border-slate-100 pt-4 flex items-center justify-between">
                        <span className="text-[10px] font-mono text-slate-400">ID: {plan.id}</span>
                        <div className="flex items-center space-x-2">
                          <button onClick={() => setActiveTab('editor')} className="px-3 py-1.5 border border-slate-300 text-slate-700 text-xs font-medium rounded hover:bg-slate-50">Edit</button>
                          <button onClick={() => setActiveTab('timer')} className="px-3 py-1.5 bg-slate-900 text-white text-xs font-medium rounded hover:bg-slate-800 flex items-center space-x-1">
                            <Icons.Play /> <span>Start Session</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'timer' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 space-y-6">
                  <div className="bg-white border border-slate-200 rounded-lg p-6 text-center shadow-sm">
                    <div className="flex justify-between items-center mb-4">
                      <span className="text-xs font-mono uppercase tracking-wider text-slate-500">{selectedPlan.title} · WEEK {selectedWeek}</span>
                      <span className="text-xs font-mono uppercase tracking-wider bg-slate-900 text-white px-2 py-0.5 rounded">WARMUP PHASE</span>
                    </div>
                    <div className="text-6xl font-mono font-bold text-slate-900 tracking-tight my-6">10:00</div>
                    <div className="flex items-center justify-center space-x-3 mb-6">
                      <button className="px-6 py-2.5 bg-slate-900 text-white rounded font-medium text-xs uppercase tracking-wider flex items-center space-x-2">
                        <Icons.Play /> <span>Start Timer</span>
                      </button>
                      <button className="p-2.5 border border-slate-300 text-slate-700 rounded hover:bg-slate-50"><Icons.Refresh /></button>
                    </div>
                    <div className="grid grid-cols-3 gap-2 border-t border-slate-100 pt-4">
                      <button className="py-2 text-xs font-mono rounded bg-slate-900 text-white">Warmup (10m)</button>
                      <button className="py-2 text-xs font-mono rounded bg-slate-100 text-slate-800 hover:bg-slate-200">Technique (25m)</button>
                      <button className="py-2 text-xs font-mono rounded bg-slate-100 text-slate-800 hover:bg-slate-200">Sparring (20m)</button>
                    </div>
                  </div>
                  <div className="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-4">
                    <h3 className="text-sm font-bold text-slate-900 font-mono uppercase border-b border-slate-100 pb-2">ACTIVE LESSON PLAN: {selectedPlan.weeks[0].title}</h3>
                    <div className="space-y-3 text-xs">
                      <div><span className="font-mono text-slate-500 uppercase font-semibold">1. Warmup & Review:</span><p className="text-slate-800 mt-0.5">{selectedPlan.weeks[0].warmup}</p></div>
                      <div><span className="font-mono text-slate-500 uppercase font-semibold">2. Technical Breakdown:</span><p className="text-slate-800 mt-0.5">{selectedPlan.weeks[0].technique}</p></div>
                      <div><span className="font-mono text-slate-500 uppercase font-semibold">3. Positional Sparring Goal:</span><p className="text-slate-800 mt-0.5">{selectedPlan.weeks[0].sparring}</p></div>
                    </div>
                  </div>
                </div>
                <div className="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
                  <h3 className="text-xs font-bold text-slate-900 font-mono uppercase mb-3 flex items-center space-x-1"><Icons.Alert /> <span>SPARRING FAILURE LOGGER</span></h3>
                  <p className="text-xs text-slate-500 mb-4">Log immediate errors during live sparring to auto-integrate into next week's warmup.</p>
                  <textarea rows="3" placeholder="e.g. Lost underhook during knee slice..." className="w-full px-3 py-2 border border-slate-300 rounded text-xs mb-3 focus:outline-none focus:ring-1 focus:ring-slate-900"></textarea>
                  <button className="w-full py-2 bg-slate-900 text-white text-xs font-medium uppercase tracking-wider rounded hover:bg-slate-800">Log Sparring Mistake</button>
                </div>
              </div>
            )}

            {activeTab === 'editor' && (
              <div className="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-5">
                <h3 className="text-sm font-bold text-slate-900 font-mono uppercase border-b border-slate-100 pb-3">CURRICULUM EDITOR — WEEK 1</h3>
                <div>
                  <label className="block text-xs font-mono uppercase text-slate-700 mb-1">Session Title / Core Topic</label>
                  <input type="text" defaultValue={selectedPlan.weeks[0].title} className="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-slate-900" />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-mono uppercase text-slate-700 mb-1">Warmup & Review (10 mins)</label>
                    <textarea rows="4" defaultValue={selectedPlan.weeks[0].warmup} className="w-full px-3 py-2 border border-slate-300 rounded text-xs font-mono focus:outline-none focus:ring-1 focus:ring-slate-900"></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-mono uppercase text-slate-700 mb-1">Technical Breakdown (25 mins)</label>
                    <textarea rows="4" defaultValue={selectedPlan.weeks[0].technique} className="w-full px-3 py-2 border border-slate-300 rounded text-xs font-mono focus:outline-none focus:ring-1 focus:ring-slate-900"></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-mono uppercase text-slate-700 mb-1">Positional Sparring (20 mins)</label>
                    <textarea rows="4" defaultValue={selectedPlan.weeks[0].sparring} className="w-full px-3 py-2 border border-slate-300 rounded text-xs font-mono focus:outline-none focus:ring-1 focus:ring-slate-900"></textarea>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'failures' && (
              <div className="space-y-4 max-w-4xl mx-auto">
                <h2 className="text-lg font-bold text-slate-900 tracking-tight border-b border-slate-200 pb-3">SPARRING FAILURE REPOSITORY</h2>
                {failures.map(f => (
                  <div key={f.id} className="bg-white border border-slate-200 rounded-lg p-4 flex justify-between items-center shadow-sm">
                    <div>
                      <span className="text-[10px] font-mono bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200 mr-2">WEEK {f.week}</span>
                      <span className="text-[10px] font-mono text-slate-400">{f.date}</span>
                      <p className="text-xs text-slate-800 font-medium mt-1">{f.note}</p>
                    </div>
                    <button className="text-slate-400 hover:text-red-600"><Icons.Trash /></button>
                  </div>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    }

    function TabButton({ id, label, icon, activeTab, setActiveTab, badge }) {
      const active = activeTab === id;
      return (
        <button onClick={() => setActiveTab(id)} className={`flex items-center space-x-2 px-3 py-1.5 text-xs font-medium rounded transition-all ${active ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}>
          {icon && <span>{icon}</span>}
          <span>{label}</span>
          {badge !== undefined && <span className={`ml-1 px-1.5 py-0.2 rounded text-[10px] font-mono ${active ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-700'}`}>{badge}</span>}
        </button>
      );
    }

    function createSamplePlan() {
      return {
        id: 'plan_default_13wk',
        title: '13-Week No-Gi Fundamental Escapes & Systems',
        style: 'NO-GI',
        level: 'BEGINNER',
        description: 'Comprehensive 1-on-1 private lesson roadmap focused on position before submission, escape priority, and hand-fighting fundamentals.',
        weeks: [{
          week: 1,
          title: 'Side Control Escapes: Frame & Elbow Push',
          warmup: '3m Stance & Snapdown drills + 7m Review',
          technique: 'Building frames from bottom side control, hip escape to Guard, Underhook recovery',
          sparring: 'Top attempts to hold side control; Bottom attempts guard recovery or underhook standup'
        }]
      };
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
